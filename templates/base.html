<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Conference Manager{% endblock %} · CSCI 341</title>
  <style>
    :root { --fg:#1f2933; --muted:#616e7c; --line:#d9dee3; --accent:#1d4ed8; --bg:#f7f8fa; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--fg); background:var(--bg); }
    header { background:#111827; color:#fff; padding:10px 24px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
    header a { color:#e5e7eb; text-decoration:none; } header a:hover { color:#fff; text-decoration:underline; }
    header .brand { font-weight:700; color:#fff; }
    main { max-width:1200px; margin:0 auto; padding:20px 24px 60px; }
    h1 { font-size:24px; margin:8px 0 16px; } h2 { font-size:18px; margin:28px 0 10px; }
    table { border-collapse:collapse; width:100%; background:#fff; margin-bottom:12px; }
    th, td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    th { background:#eef1f4; font-weight:600; }
    a { color:var(--accent); }
    .flash { padding:10px 12px; border-radius:6px; margin:8px 0; border:1px solid; }
    .flash.error { background:#fef2f2; border-color:#fca5a5; color:#991b1b; }
    .flash.success { background:#f0fdf4; border-color:#86efac; color:#166534; }
    .flash.info { background:#eff6ff; border-color:#93c5fd; color:#1e40af; }
    form.inline { display:inline; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
    label { display:block; font-weight:600; margin:10px 0 4px; }
    input[type=text], input[type=email], input[type=number], input[type=date], input[type=time],
    input[type=datetime-local], select, textarea { width:100%; max-width:640px; padding:6px 8px; border:1px solid #b6bec8; border-radius:4px; font:inherit; background:#fff; }
    label > input:not([type=checkbox]):not([type=radio]), label > textarea, label > select { display:block; margin-top:4px; font-weight:400; }
    textarea { min-height:70px; }
    .row-inputs select, .row-inputs input { width:auto; }
    .hint { color:var(--muted); font-size:13px; font-weight:400; }
    button, .button { display:inline-block; padding:6px 12px; border-radius:4px; border:1px solid #1d4ed8; background:#1d4ed8; color:#fff; font:inherit; cursor:pointer; text-decoration:none; }
    button.secondary, .button.secondary { background:#fff; color:#1d4ed8; }
    button.danger { background:#b91c1c; border-color:#b91c1c; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0; }
    .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:#e5e7eb; font-size:12px; margin:1px 2px; }
    .status-accepted { background:#dcfce7; } .status-rejected { background:#fee2e2; } .status-withdrawn { background:#f3f4f6; color:#6b7280; }
    .status-submitted { background:#e0e7ff; } .status-under-review { background:#fef9c3; }
    dl.kv { display:grid; grid-template-columns:200px 1fr; gap:4px 12px; margin:0; } dl.kv dt { font-weight:600; color:var(--muted); }
    fieldset { border:1px solid var(--line); border-radius:6px; margin:14px 0; padding:8px 14px 14px; background:#fff; }
    legend { font-weight:700; padding:0 6px; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">Conference &amp; Review Manager</a>
  <a href="{{ url_for('users_list') }}">Users</a>
  <a href="{{ url_for('papers_list') }}">Papers</a>
  <a href="{{ url_for('reviews_list') }}">Reviews</a>
  <a href="{{ url_for('sessions_list') }}">Sessions</a>
  <a href="{{ url_for('schedule') }}">Schedule (view)</a>
  <a href="{{ url_for('conferences') }}">Conferences &amp; tracks</a>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category if category in ['error','success','info'] else 'info' }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
